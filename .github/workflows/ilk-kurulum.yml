        run: |
          printf '%s' "$VOLKAN_PROJE_ZIP" | base64 --decode > /tmp/volkan-tarayici.zip
          mkdir -p /tmp/volkan-kaynak
          unzip -q /tmp/volkan-tarayici.zip -d /tmp/volkan-kaynak
          cp -a /tmp/volkan-kaynak/VolkanTarayici/. .
          git rm --ignore-unmatch .github/workflows/ilk-kurulum.yml
          git config user.name "Volkan Tarayici Kurulum"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git commit -m "Volkan Tarayici ilk surumunu kur" || true
          git push

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Android 16 bilesenlerini kur
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Test APK'sini olustur
        run: gradle :app:assembleDebug --stacktrace

      - name: APK'yi indirilebilir yap
        uses: actions/upload-artifact@v4
        with:
          name: VolkanTarayici-test
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
