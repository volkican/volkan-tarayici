plugins {
    id 'com.android.application'
}

android {
    namespace 'com.volkan.volkantarayici'
    compileSdk 36

    defaultConfig {
        applicationId 'com.volkan.volkantarayici'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    implementation 'org.mozilla.geckoview:geckoview:153.0.20260810162159'
    implementation 'com.wireguard.android:tunnel:1.0.20260102'
}
