name: Volkan Tarayici APK

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/ilk-kurulum.yml"

jobs:
  derle:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Android 16 uyumlulugunu ayarla
        shell: bash
        run: |
          sed -i "s/geckoview:155.0.20260903215306/geckoview:153.0.20260810162159/" app/build.gradle
          grep -q "geckoview:153.0.20260810162159" app/build.gradle
          git config user.name "Volkan Tarayici Derleme"
          git config user.email "actions@users.noreply.github.com"
          git add app/build.gradle
          git commit -m "GeckoView Android 16 uyumlulugunu duzelt" || true
          git push

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Android 16 bilesenlerini kur
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Test APK'sini olustur
        run: gradle :app:assembleDebug --stacktrace

      - name: APK'yi indirilebilir yap
        uses: actions/upload-artifact@v4
        with:
          name: VolkanTarayici-test
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
